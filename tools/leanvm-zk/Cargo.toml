[package]
name = "leanvm-zk-reference"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
leanvm = { git = "https://github.com/sm-stack/leanVM", rev = "3e269bd4137976648052a3335845d0c19693ec0d" }
parallel = { git = "https://github.com/sm-stack/leanVM", rev = "3e269bd4137976648052a3335845d0c19693ec0d" }
leanvm_guest = { git = "https://github.com/sm-stack/leanVM", rev = "3e269bd4137976648052a3335845d0c19693ec0d" }
serde_json = "1"
flate2 = "1"

[workspace]

[[bin]]
name = "zk_proofs"
path = "src/main.rs"

[lib]
name = "leanvm_mixed_reference"

[[bin]]
name = "root_components"
path = "../leanvm-mixed/src/bin/root_components.rs"

[[bin]]
name = "benchmark"
path = "../leanvm-mixed/src/bin/benchmark.rs"

[[bin]]
name = "production"
path = "src/production.rs"

[[bin]]
name = "key_vectors"
path = "src/key_vectors.rs"
