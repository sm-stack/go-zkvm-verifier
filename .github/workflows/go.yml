name: pure-go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: python3 tools/check_artifacts.py
      - run: python3 tools/gen_poseidon2.py --check
      - run: go test -p 1 ./...
      - run: go test -tags purego -p 1 ./...
      - if: runner.arch == 'ARM64'
        run: GODEBUG=cpu.pmull=off go test -p 1 ./leanvm -count=1
      - run: go vet -p 1 ./...
      - if: runner.os == 'Linux'
        run: python3 tools/check_guards.py
      - run: go build -p 1 -o bin/stark-go-verify ./cmd/stark-go-verify
      - run: go test -p 1 ./leanvm -run '^$' -fuzz '^FuzzDecodeProof$' -fuzztime 15s -parallel 1
      - run: go test -p 1 ./sp1 -run '^$' -fuzz '^FuzzDecodeCompressedProof$' -fuzztime 15s -parallel 1
      - run: go test -p 1 ./leanvm -run '^$' -fuzz '^FuzzVerify$' -fuzztime 15s -parallel 1
      - run: go test -p 1 ./sp1 -run '^$' -fuzz '^FuzzVerify$' -fuzztime 15s -parallel 1
      - run: go test -p 1 ./sp1 -run '^$' -fuzz '^FuzzPermutation$' -fuzztime 15s -parallel 1
      - if: runner.arch == 'ARM64'
        run: go test -p 1 ./leanvm -run '^$' -fuzz '^FuzzFieldBackend$' -fuzztime 15s -parallel 1
